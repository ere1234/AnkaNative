# Builds the play app (dev.ankanative.android.play, "Anka Native") for Ocarina of Time on GitHub's runners, for a phone-only setup: the on-device
# packer's stage (android/ondevice/build.sh), then the APK (android/README.md "Build the APK"). It installs beside the official app. Signed with
# .github/ci/debug.keystore.b64, a fixed debug key, so each build installs over the last one and keeps its data.
name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: NDK, CMake and Ninja
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Fixed signing key
        run: mkdir -p ~/.android && base64 -d .github/ci/debug.keystore.b64 > ~/.android/debug.keystore
      - name: On-device packer stage
        run: bash android/ondevice/build.sh "$RUNNER_TEMP/ondevice" all
      - name: APK
        working-directory: android/app
        run: ./gradlew --no-daemon -PnxPackStage="$RUNNER_TEMP/ondevice/stage" -PnxGames=0400486024DEC000 -PnxPlay=true apk
      - uses: actions/upload-artifact@v4
        with:
          name: anka-native-play
          path: android/app/out/anka-native-play.apk
          if-no-files-found: error
